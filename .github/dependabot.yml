version: 2
updates:
  - package-ecosystem: gradle
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major"]
    groups:
      # Las tres piezas de JJWT (api, impl y gson) tienen que ir siempre en la misma version
      jjwt:
        patterns: ["io.jsonwebtoken:*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      # Herramientas ligadas a Angular 14: suben de version mayor con la migracion (v2.1)
      - dependency-name: "@angular-devkit/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "karma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "karma-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jasmine-core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jasmine"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zone.js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "rxjs"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-minor"]
      # En 0.x, Dependabot cuenta 0.11 a 0.16 como menor; Angular 14 solo admite zone.js 0.11 y 0.12
      - dependency-name: "zone.js"
        update-types: ["version-update:semver-minor"]
      # Exige una version de Angular mas reciente; se revisa en la migracion (v2.1)
      - dependency-name: "@stripe/stripe-js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker-compose
    directory: /infra/docker
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "louislam/uptime-kuma"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }