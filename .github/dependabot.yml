version: 2
updates:
  - package-ecosystem: gradle
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major"]
    groups:
      # Las tres piezas de JJWT (api, impl y gson) tienen que ir siempre en la misma version
      jjwt:
        patterns: ["io.jsonwebtoken:*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    ignore:
      # Las versiones mayores de Angular se hacen a mano con `ng update`, que ademas migra el codigo
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-devkit/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zone.js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "rxjs"
        update-types: ["version-update:semver-major"]
      # Cada version de Angular admite un rango cerrado de TypeScript (Angular 22: >=6.0 <6.1);
      # TypeScript sube junto con Angular, con `ng update`
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-minor"]
      # En 0.x, Dependabot cuenta un salto de zone.js como menor; Angular 22 admite 0.15 y 0.16
      - dependency-name: "zone.js"
        update-types: ["version-update:semver-minor"]
      # Node sube de version mayor junto con Angular (Angular 22 pide Node 22 o 24)
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker-compose
    directory: /infra/docker
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "louislam/uptime-kuma"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }