name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master", "dev" ]

permissions:
  contents: read

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install & Build
        run: |
          cd frontend
          npm ci --legacy-peer-deps --ignore-scripts
          npm run build -- --configuration=production

      - name: Tests del frontend con cobertura
        run: |
          cd frontend
          npx ng test --watch=false --coverage
          # SonarCloud lee las rutas del informe desde la raiz del repo
          sed -i 's#^SF:src/#SF:frontend/src/#' coverage/BarHub/lcov.info

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Tests del backend con cobertura
        run: |
          cd backend
          chmod +x gradlew
          ./gradlew test --no-daemon

      - name: SonarCloud Scan
        if: ${{ github.actor != 'dependabot[bot]' }}
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=juanparejog
            -Dsonar.projectKey=juanparejog_BarHub2.0
            -Dsonar.projectVersion=2.1.0
            -Dsonar.sources=.
            -Dsonar.exclusions=backend/build/**,backend/src/test/**,backend/src/main/resources/demo/**,frontend/src/**/*.spec.ts
            -Dsonar.coverage.exclusions=seguridad/**,frontend/src/**/*.module.ts,frontend/src/environments/**,frontend/src/main.ts
            -Dsonar.tests=backend/src/test/java,frontend/src
            -Dsonar.test.inclusions=backend/src/test/java/**,frontend/src/**/*.spec.ts
            -Dsonar.java.binaries=backend/build/classes/java/main
            -Dsonar.java.test.binaries=backend/build/classes/java/test
            -Dsonar.coverage.jacoco.xmlReportPaths=backend/build/reports/jacoco/test/jacocoTestReport.xml
            -Dsonar.javascript.lcov.reportPaths=frontend/coverage/BarHub/lcov.info

  docker-build:
    needs: build-and-analyze
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/barhub-frontend:latest