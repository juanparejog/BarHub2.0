name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master", "dev" ]

permissions:
  contents: read

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install & Build
        run: |
          cd frontend
          npm ci --legacy-peer-deps --ignore-scripts
          npm run build -- --configuration=production

      - name: Tests del frontend con cobertura
        run: |
          cd frontend
          # npm test usa el Angular CLI ya instalado por npm ci; npx podria descargar otro
          npm test -- --watch=false --coverage
          # SonarCloud lee las rutas del informe desde la raiz del repo
          sed -i 's#^SF:src/#SF:frontend/src/#' coverage/BarHub/lcov.info

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Tests del backend con cobertura
        run: |
          cd backend
          chmod +x gradlew
          ./gradlew test --no-daemon

      - name: SonarCloud Scan
        if: ${{ github.actor != 'dependabot[bot]' }}
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # Avisos revisados y descartados, cada uno limitado a su regla y su archivo (motivos en docs/auditorias.md):
        # - css:S9440 (movimiento reducido) solo busca el @media en el mismo archivo, pero la regla
        #   global de frontend/src/styles.css ya lo aplica a todos los componentes
        # - java:S4790 en Totp: la RFC 6238 y las apps de autenticacion exigen HMAC-SHA1, que no se
        #   ve afectado por las colisiones de SHA1
        # - java:S2143 en JwtUtils: JJWT 0.13 solo acepta java.util.Date en issuedAt y expiration
        # - Web:S6840 en el telefono del perfil: tel-national es un valor valido de autocomplete;
        #   con tel el navegador pondria el prefijo +34 y no cabria en las 9 cifras
        with:
          args: >
            -Dsonar.organization=juanparejog
            -Dsonar.projectKey=juanparejog_BarHub2.0
            -Dsonar.projectVersion=2.1.0
            -Dsonar.sources=.
            -Dsonar.exclusions=backend/build/**,backend/src/test/**,backend/src/main/resources/demo/**,frontend/src/**/*.spec.ts,e2e/**,seguridad/soc/test_*.py
            -Dsonar.coverage.exclusions=seguridad/**,frontend/src/**/*.module.ts,frontend/src/environments/**,frontend/src/main.ts
            -Dsonar.tests=backend/src/test/java,frontend/src,e2e,seguridad/soc
            -Dsonar.test.inclusions=backend/src/test/java/**,frontend/src/**/*.spec.ts,e2e/tests/**/*.ts,e2e/*.ts,seguridad/soc/test_*.py
            -Dsonar.java.binaries=backend/build/classes/java/main
            -Dsonar.java.test.binaries=backend/build/classes/java/test
            -Dsonar.coverage.jacoco.xmlReportPaths=backend/build/reports/jacoco/test/jacocoTestReport.xml
            -Dsonar.javascript.lcov.reportPaths=frontend/coverage/BarHub/lcov.info
            -Dsonar.issue.ignore.multicriteria=movimiento,totp,jwt,telefono
            -Dsonar.issue.ignore.multicriteria.movimiento.ruleKey=css:S9440
            -Dsonar.issue.ignore.multicriteria.movimiento.resourceKey=frontend/src/app/**/*.css
            -Dsonar.issue.ignore.multicriteria.totp.ruleKey=java:S4790
            -Dsonar.issue.ignore.multicriteria.totp.resourceKey=backend/src/main/java/com/daw2/barhub/auth/dosfactores/Totp.java
            -Dsonar.issue.ignore.multicriteria.jwt.ruleKey=java:S2143
            -Dsonar.issue.ignore.multicriteria.jwt.resourceKey=backend/src/main/java/com/daw2/barhub/auth/jwt/JwtUtils.java
            -Dsonar.issue.ignore.multicriteria.telefono.ruleKey=Web:S6840
            -Dsonar.issue.ignore.multicriteria.telefono.resourceKey=frontend/src/app/public/perfil/direccion/perfil-direccion.component.html

  e2e:
    # La aplicacion completa (MariaDB, backend, frontend y Caddy) levantada con Docker Compose
    # y recorrida con Playwright como lo haria un usuario
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Variables de entorno de la prueba
        # Claves aleatorias en cada ejecucion: no hace falta ningun secreto del repositorio
        run: |
          clave() { openssl rand -hex 32; }
          admin="$(clave)"
          echo "::add-mask::$admin"
          {
            echo "MYSQL_ROOT_PASSWORD=$(clave)"
            echo "DB_DATABASE=barhub_e2e"
            echo "DB_USERNAME=barhub"
            echo "DB_PASSWORD=$(clave)"
            echo "JWT_SECRET=$(clave)$(clave)"
            echo "APP_TOTP_CLAVE=$(clave)"
            echo "APP_SEED_DEMO=true"
            echo "APP_SEED_ADMIN_USERNAME=admin"
            echo "APP_SEED_ADMIN_PASSWORD=$admin"
          } > infra/docker/.env
          echo "E2E_ADMIN_PASSWORD=$admin" >> "$GITHUB_ENV"

      - name: Arrancar BarHub
        run: docker compose -f infra/docker/docker-compose.yml up -d --build mysql backend frontend caddy mailpit

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'e2e/package-lock.json'

      - name: Instalar Playwright
        working-directory: e2e
        run: |
          npm ci --ignore-scripts
          npm run navegador:ci

      - name: Esperar a que la API sirva la carta
        run: |
          for intento in $(seq 1 60); do
            if curl -fsS http://localhost/api/productos/ | grep -q '"nombre"'; then
              echo "API lista"
              exit 0
            fi
            sleep 5
          done
          echo "La API no responde tras 5 minutos"
          exit 1

      - name: Tests E2E
        working-directory: e2e
        run: npm test

      - name: Logs del backend
        if: failure()
        run: docker compose -f infra/docker/docker-compose.yml logs backend --tail 300

      - name: Informe de Playwright
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: informe-e2e
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  soc:
    # SOC: tests de soc.py y la configuracion leida por las imagenes fijadas (Loki carga y evalua
    # las reglas de alerta, amtool revisa la de Alertmanager y Alloy la suya)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tests de soc.py
        run: python3 -m unittest discover -s seguridad/soc -p "test_*.py" -v

      - name: Validar la configuracion del SOC
        run: python3 seguridad/soc/soc.py validar

  docker-build:
    # La imagen solo se publica si pasan el analisis, los tests E2E y los del SOC
    needs: [build-and-analyze, e2e, soc]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/barhub-frontend:latest