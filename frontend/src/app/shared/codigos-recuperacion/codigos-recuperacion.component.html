<ul class="codigos" aria-label="Códigos de recuperación">
  @for (codigo of codigos(); track codigo) {
    <li><code>{{ codigo }}</code></li>
  }
</ul>
<div class="acciones-codigos">
  <button type="button" class="btn btn-outline-secondary" (click)="descargar()">
    <i class="bi bi-download me-1" aria-hidden="true"></i>Descargar
  </button>
  <button type="button" class="btn btn-outline-secondary" (click)="copiar()">
    <i class="bi bi-clipboard me-1" aria-hidden="true"></i>{{ copiados() ? 'Copiados' : 'Copiar' }}
  </button>
</div>
<div class="form-check mt-3 text-start">
  <input class="form-check-input" type="checkbox" id="codigosGuardados" [checked]="guardados()"
    (change)="guardados.set(!guardados())">
  <label class="form-check-label" for="codigosGuardados">He guardado los códigos en un lugar seguro</label>
</div>
<div class="acciones-codigos">
  <button type="button" class="btn btn-primary" [disabled]="!guardados()" (click)="terminado.emit()">{{ textoBoton() }}</button>
</div>
