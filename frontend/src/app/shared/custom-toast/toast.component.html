<div class="toast-notification" 
     *ngIf="show" 
     [ngClass]="type" 
     (click)="onClose()"
     (keydown.enter)="onClose()">
     
    <span class="toast-message">{{ message }}</span>
    <button type="button" 
            class="toast-close border-0 bg-transparent" 
            aria-label="Cerrar notificación" 
            (click)="onClose()">
        &times;
    </button>
</div>
