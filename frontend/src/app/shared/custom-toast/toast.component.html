<output class="toast-live" aria-live="polite" aria-atomic="true">
  @if (show) {
    <span class="toast-notification"
      [ngClass]="type"
      (click)="onClose()"
      (keydown.enter)="onClose()">
      <span class="toast-message">{{ message }}</span>
      <button type="button"
        class="toast-close border-0 bg-transparent"
        [attr.aria-label]="'aviso.cerrar' | t"
        (click)="onClose()">
        &times;
      </button>
    </span>
  }
</output>
