@if (reautenticacion.solicitud()) {
  <div class="modal-backdrop fade show"></div>
  <div class="modal d-block" tabindex="-1" role="dialog" aria-modal="true"
    aria-labelledby="reautenticacionTitulo" aria-describedby="reautenticacionTexto" (keydown.escape)="cancelar()">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" (submit)="$event.preventDefault(); confirmar()" novalidate>
        <div class="modal-header">
          <h2 class="modal-title h5" id="reautenticacionTitulo">
            <i class="bi bi-shield-lock me-2" aria-hidden="true"></i>Confirma que eres tú
          </h2>
        </div>
        <div class="modal-body">
          <p id="reautenticacionTexto">
            @if (conCodigo()) {
              Es una acción protegida. Escribe el código de 6 dígitos de tu app de autenticación.
            } @else {
              Es una acción protegida. Escribe tu contraseña.
            }
          </p>
          <label for="campoReautenticacion" class="form-label">{{ conCodigo() ? 'Código de verificación' : 'Contraseña' }}</label>
          @if (conCodigo()) {
            <input #campo id="campoReautenticacion" class="form-control" autocomplete="one-time-code"
              inputmode="numeric" maxlength="7" [attr.aria-invalid]="!!error()">
          } @else {
            <input #campo id="campoReautenticacion" class="form-control" type="password"
              autocomplete="current-password" maxlength="100" [attr.aria-invalid]="!!error()">
          }
          @if (error()) {
            <div class="text-danger mt-2" role="alert">{{ error() }}</div>
          }
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" (click)="cancelar()">Cancelar</button>
          <button type="submit" class="btn btn-primary" [disabled]="enviando()">Confirmar</button>
        </div>
      </form>
    </div>
  </div>
}
