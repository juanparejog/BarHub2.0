@if (aviso.estado() === 'inactividad') {
  <div class="modal-backdrop fade show"></div>
  <div class="modal d-block" tabindex="-1" role="alertdialog" aria-modal="true"
    aria-labelledby="avisoSesionTitulo" aria-describedby="avisoSesionTexto">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="avisoSesionTitulo">
            <i class="bi bi-hourglass-split me-2" aria-hidden="true"></i>{{ 'sesion.sigues' | t }}
          </h2>
        </div>
        <div class="modal-body" id="avisoSesionTexto">
          {{ 'sesion.inactividad' | t }}
          <strong class="cuenta-atras">{{ aviso.texto() }}</strong>.
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" (click)="aviso.cerrarSesion()">{{ 'sesion.cerrar' | t }}</button>
          <button #botonSeguir type="button" class="btn btn-primary" (click)="aviso.seguirConectado()">{{ 'sesion.seguir' | t }}</button>
        </div>
      </div>
    </div>
  </div>
}

@if (aviso.estado() === 'fin-proximo') {
  <output class="aviso-fin alert alert-warning d-flex align-items-start gap-2 shadow">
    <i class="bi bi-clock-history fs-5" aria-hidden="true"></i>
    <div class="flex-grow-1">
      {{ 'sesion.fin.antes' | t }} <strong>{{ aviso.texto() }}</strong> {{ 'sesion.fin.despues' | t }}
    </div>
    <button type="button" class="btn-close" [attr.aria-label]="'sesion.cerrarAviso' | t" (click)="aviso.descartarAvisoDeFin()"></button>
  </output>
}
