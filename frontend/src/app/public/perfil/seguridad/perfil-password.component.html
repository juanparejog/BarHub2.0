<h3 class="h6 fw-bold mb-1"><i class="bi bi-key text-indigo me-2" aria-hidden="true"></i>{{ 'perfil.clave.titulo' | t }}</h3>
<p class="text-muted font-size-14 mb-3">{{ 'perfil.clave.ayuda' | t }}</p>

<form [formGroup]="form" (ngSubmit)="cambiar()" novalidate>
  <div class="row g-3">
    <div class="col-md-4">
      <label for="passwordActual" class="form-label font-size-14 fw-semibold">{{ 'perfil.clave.actual' | t }}</label>
      <input type="password" id="passwordActual" class="form-control search-input" formControlName="actual"
        autocomplete="current-password" [class.is-invalid]="invalido('actual')" [attr.aria-invalid]="invalido('actual')">
    </div>
    <div class="col-md-4">
      <label for="passwordNueva" class="form-label font-size-14 fw-semibold">{{ 'perfil.clave.nueva' | t }}</label>
      <input type="password" id="passwordNueva" class="form-control search-input" formControlName="nueva"
        autocomplete="new-password" maxlength="40" aria-describedby="passwordNueva-ayuda"
        [class.is-invalid]="invalido('nueva')" [attr.aria-invalid]="invalido('nueva')">
      <div class="form-text" id="passwordNueva-ayuda">{{ 'perfil.clave.formato' | t }}</div>
    </div>
    <div class="col-md-4">
      <label for="passwordRepetida" class="form-label font-size-14 fw-semibold">{{ 'perfil.clave.repetir' | t }}</label>
      <input type="password" id="passwordRepetida" class="form-control search-input" formControlName="repetida"
        autocomplete="new-password" maxlength="40" aria-describedby="passwordRepetida-error"
        [class.is-invalid]="invalido('repetida')" [attr.aria-invalid]="invalido('repetida')">
      <div class="invalid-feedback" id="passwordRepetida-error">{{ 'perfil.clave.noCoinciden' | t }}</div>
    </div>
  </div>

  @if (error()) {
    <div class="alert alert-danger custom-alert mt-3 mb-0" role="alert">{{ error() }}</div>
  }
  @if (exito()) {
    <div class="alert alert-success custom-alert mt-3 mb-0" role="status">{{ exito() }}</div>
  }

  <div class="d-flex justify-content-end mt-3">
    <button type="submit" class="btn-crud-primary px-4 py-2" [disabled]="enviando()">{{ 'perfil.clave.boton' | t }}</button>
  </div>
</form>
