<nav class="navbar navbar-expand-lg navbar-dark custom-navbar sticky-top">
  <div class="container-fluid navbar-container">
    
    <!-- Logo & Brand -->
    <a class="navbar-brand custom-brand" routerLink="/home">
      <img src="assets/images/logo.png" alt="BarHub Logo" class="brand-logo">
    </a>

    <!-- Botón Hamburguesa Móvil -->
    <button class="navbar-toggler custom-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown"
      aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Contenido colapsable -->
    <div class="collapse navbar-collapse" id="navbarNavDropdown">
      
      <!-- Navegación principal -->
      <ul class="navbar-nav me-auto main-nav-links">
        <li class="nav-item">
          <a class="nav-link" routerLink="/home" routerLinkActive="active">Inicio</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/carta" routerLinkActive="active">Carta</a>
        </li>
        <li class="nav-item" *ngIf="isCliente || isEmple || isAdmin">
          <a class="nav-link" routerLink="/seguimiento-pedidos" routerLinkActive="active">Sigue tu pedido</a>
        </li>
        <li class="nav-item" *ngIf="isEmple || isAdmin">
          <a class="nav-link" routerLink="/empleado/gestionar-mesas" routerLinkActive="active">Estado mesas</a>
        </li>
        <li class="nav-item" *ngIf="isEmple || isAdmin">
          <a class="nav-link" routerLink="/empleado/gestionar-pagos" routerLinkActive="active">Pagos</a>
        </li>
        <li class="nav-item" *ngIf="isEmple || isAdmin">
          <a class="nav-link" routerLink="/empleado/gestionar-comandas" routerLinkActive="active">Comandas</a>
        </li>
        <li class="nav-item" *ngIf="isEmple || isAdmin">
          <a class="nav-link" routerLink="/empleado/gestionar-caja" routerLinkActive="active">Caja</a>
        </li>
        <li class="nav-item dropdown" *ngIf="isAdmin">
          <a class="nav-link dropdown-toggle user-dropdown-toggle d-flex align-items-center gap-2" 
             href="#" 
             data-bs-toggle="dropdown" 
             aria-expanded="false"
             (keydown.enter)="$event.preventDefault()">
            <i class="bi bi-shield-lock-fill"></i> Admin
          </a>
          <ul class="dropdown-menu custom-dropdown" aria-labelledby="adminDropdown">
            <li>
              <a class="dropdown-item d-flex align-items-center" routerLink="/admin" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
                <i class="bi bi-grid-1x2-fill me-2"></i> Panel de Gestión
              </a>
            </li>
            <li>
              <a class="dropdown-item d-flex align-items-center" routerLink="/admin/metricas" routerLinkActive="active">
                <i class="bi bi-bar-chart-line-fill me-2"></i> Métricas
              </a>
            </li>
          </ul>
        </li>
      </ul>

      <!-- Zona de autenticación y Modo Oscuro -->
      <div class="auth-section d-flex align-items-center gap-2">
        
        <div class="theme-switch-group me-3" 
             (click)="toggleTheme()"
             (keydown.enter)="toggleTheme()"
             [title]="(isDarkMode$ | async) ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'">
        
          <div class="theme-switch-option" [class.active]="!(isDarkMode$ | async)">
            <i class="bi bi-sun-fill"></i>
          </div>
          
          <div class="theme-switch-option" [class.active]="isDarkMode$ | async">
            <i class="bi bi-moon-stars-fill"></i>
          </div>
        </div>

        <!-- Sin iniciar sesión -->
        <div *ngIf="!sesionIniciada" class="auth-buttons d-flex align-items-center">
          <a class="nav-link btn-login" routerLink="/auth/login">Iniciar sesión</a>
          <a class="btn btn-primary custom-btn-register ms-lg-2" routerLink="/auth/register">Registrarse</a>
        </div>

        <!-- Usuario con sesión iniciada -->
        <div *ngIf="sesionIniciada" class="user-menu">
          <ul class="navbar-nav">
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle user-dropdown-toggle d-flex align-items-center gap-2" 
                 href="#" 
                 data-bs-toggle="dropdown" 
                 aria-expanded="false"
                 (keydown.enter)="$event.preventDefault()">

                <!-- Avatar del usuario con imagen o respaldo por defecto -->
                <div class="user-avatar-wrapper">
                  <img [src]="imagenUsuario" 
                       (error)="onImageError($event)" 
                       class="rounded-circle object-fit-cover shadow-sm border border-1 border-primary" 
                       style="width: 35px; height: 35px;" 
                       alt="Avatar">
                </div>
              
                <span *ngIf="nombreUsuario" class="user-name fw-semibold">{{ nombreUsuario }}</span>
              </a>
              <ul class="dropdown-menu dropdown-menu-end custom-dropdown">
                <li>
                  <a class="dropdown-item d-flex align-items-center" routerLink="/perfil" routerLinkActive="active">
                    <i class="bi bi-person-fill me-2"></i> Perfil
                  </a>
                </li>
                <li><hr class="dropdown-divider"></li>
                <li>
                  <a class="dropdown-item logout-item d-flex align-items-center" href="#" (click)="cerrarSesion(); $event.preventDefault()">
                    <i class="bi bi-box-arrow-right me-2"></i> Cerrar sesión
                  </a>
                </li>
              </ul>
            </li>
          </ul>
        </div>

      </div>

    </div>
  </div>
</nav>
