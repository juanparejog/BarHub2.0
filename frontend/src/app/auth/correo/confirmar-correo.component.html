<div class="cuenta-correo">
  <h2>{{ 'correo.titulo' | t }}</h2>
  @switch (estado) {
    @case ('comprobando') {
      <output class="d-block mb-3">{{ 'correo.comprobando' | t }}</output>
    }
    @case ('confirmado') {
      <output class="text-success fw-semibold d-block mb-3">{{ mensaje }}</output>
      <div class="acciones">
        <a class="btn btn-primary" routerLink="/auth/login">{{ 'auth.iniciarSesion' | t }}</a>
      </div>
    }
    @case ('error') {
      <p class="text-danger" role="alert">{{ mensaje }}</p>
      <p class="text-muted">{{ 'correo.pedirOtro' | t }}</p>
      <div class="acciones">
        <a class="btn btn-outline-secondary" routerLink="/auth/login">{{ 'auth.irAlLogin' | t }}</a>
      </div>
    }
  }
</div>
