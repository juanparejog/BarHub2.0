<div class="cuenta-correo">
  <h2>Confirmar correo</h2>
  @switch (estado) {
    @case ('comprobando') {
      <p role="status">Comprobando el enlace…</p>
    }
    @case ('confirmado') {
      <p class="text-success fw-semibold" role="status">{{ mensaje }}</p>
      <div class="acciones">
        <a class="btn btn-primary" routerLink="/auth/login">Iniciar sesión</a>
      </div>
    }
    @case ('error') {
      <p class="text-danger" role="alert">{{ mensaje }}</p>
      <p class="text-muted">Desde el inicio de sesión puedes pedir que te enviemos otro enlace.</p>
      <div class="acciones">
        <a class="btn btn-outline-secondary" routerLink="/auth/login">Ir al inicio de sesión</a>
      </div>
    }
  }
</div>
