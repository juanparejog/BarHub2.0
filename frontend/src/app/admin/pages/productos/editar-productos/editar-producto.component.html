<div class="crud-container">
    <div class="crud-form-card">
        <h2 class="crud-title mb-4">Gestión de Producto</h2>

        <form (ngSubmit)="guardar()" [formGroup]="formulario" autocomplete="off">

            <input id="id" name="id" type="hidden" value="-1">

            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre:</label>
                <input formControlName="nombre" type="text" class="form-control" id="nombre">
            </div>

            <div class="mb-3">
                <label for="descripcion" class="form-label">Descripción:</label>
                <input formControlName="descripcion" type="text" class="form-control" id="descripcion">
            </div>

            <div class="mb-3">
                <label for="precio" class="form-label">Precio:</label>
                <input formControlName="precio" type="number" class="form-control" id="precio">
            </div>

            <div class="mb-3">
                <label for="tipoProducto" class="form-label">Tipo:</label>
                <select id="tipoProducto" formControlName="tipoProducto" class="form-control" required>
                    <option value="bebida">Bebida</option>
                    <option value="entrante">Entrante</option>
                    <option value="tapa">Tapa</option>
                    <option value="postre">Postre</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="imagen" class="form-label">Imagen:</label>
                <input formControlName="imagen" type="file" class="form-control" id="imagen" accept=".png, .jpg, .jpeg, image/png, image/jpeg">
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4">
                <button type="button" class="btn-crud-secondary" routerLink="/admin/gestionar-productos">Volver</button>
                <button type="submit" class="btn-crud-primary">Guardar</button>
            </div>

        </form>
    </div>
</div>
