<div class="crud-container" *ngIf="usuario">
    <!-- Header Principal -->
    <div class="crud-header">
      <div>
        <h1 class="crud-title">Usuario #{{ usuario.id }}</h1>
        <p class="text-muted small mb-0">Detalles e información general del usuario</p>
      </div>
      <div>
        <button [routerLink]="['/admin/gestionar-usuarios']" class="btn-crud-secondary d-inline-flex align-items-center gap-2">
          <i class="bi bi-arrow-left"></i>
          <span>Volver</span>
        </button>
      </div>
    </div>
  
    <!-- Contenedor / Tarjeta con Animación -->
    <div class="crud-card">
      <div class="table-responsive">
        <table class="crud-table">
          <thead>
            <tr>
              <th class="ps-4">Nombre de Usuario</th>
              <th>Email</th>
              <th>Roles Asignados</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <!-- Nombre -->
              <td class="ps-4 fw-semibold text-dark">
                {{ usuario.username }}
              </td>
  
              <!-- Email -->
              <td class="text-secondary">
                {{ usuario.email }}
              </td>
  
              <!-- Roles -->
              <td>
                <div class="d-flex flex-wrap gap-1 align-items-center">
                  <ng-container *ngIf="usuario.roles && usuario.roles.length > 0; else sinRolesDetail">
                    <span 
                      *ngFor="let rol of usuario.roles" 
                      class="badge-role" 
                      [ngClass]="getRolClass(getNombreRol(rol))">
                      <i class="bi bi-shield-lock"></i>
                      {{ formatearNombreRol(getNombreRol(rol)) }}
                    </span>
                  </ng-container>
                  
                  <ng-template #sinRolesDetail>
                    <span class="badge-role text-muted bg-light border">
                      <i class="bi bi-exclamation-circle"></i> Sin Roles
                    </span>
                  </ng-template>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
  
      <!-- Pie de Tarjeta con botón de Acción -->
      <div class="p-3 bg-light border-top d-flex justify-content-end">
        <button [routerLink]="['/admin/editar-usuarios', usuario.id]" class="btn-crud-primary d-inline-flex align-items-center gap-2">
          <i class="bi bi-pencil-square"></i>
          <span>Editar Usuario</span>
        </button>
      </div>
    </div>
  </div>
