<div class="crud-container" *ngIf="mesa">
    <!-- Header principal -->
    <div class="crud-header">
      <div>
        <h1 class="crud-title">Mesa #{{ mesa.id }}</h1>
        <p class="text-muted small mb-0">Detalles e información del estado de la mesa</p>
      </div>
      <div>
        <button [routerLink]="['/admin/gestionar-mesas']" class="btn-crud-secondary d-inline-flex align-items-center gap-2">
          <i class="bi bi-arrow-left"></i>
          <span>Volver</span>
        </button>
      </div>
    </div>
  
    <!-- Contenedor / Tarjeta -->
    <div class="crud-card">
      <div class="table-responsive">
        <table class="crud-table">
          <thead>
            <tr>
              <th class="ps-4">Código QR</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="ps-4 font-monospace fw-semibold text-dark">
                {{ mesa.codigoqr }}
              </td>
              <td>
                <span class="badge text-capitalize px-3 py-1"
                      [ngClass]="{
                        'bg-success-subtle text-success': mesa.estado === 'disponible',
                        'bg-danger-subtle text-danger': mesa.estado === 'ocupada',
                        'bg-warning-subtle text-warning': mesa.estado === 'reservada'
                      }">
                  {{ mesa.estado }}
                </span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
  
      <!-- Pie de Tarjeta con botón de Acción -->
      <div class="p-3 bg-light border-top d-flex justify-content-end">
        <button [routerLink]="['/admin/editar-mesas', mesa.id]" class="btn-crud-primary d-inline-flex align-items-center gap-2">
          <i class="bi bi-pencil-square"></i>
          <span>Editar Mesa</span>
        </button>
      </div>
    </div>
  </div>
