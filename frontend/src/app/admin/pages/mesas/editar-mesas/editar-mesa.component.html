<div class="crud-container">
    <div class="crud-form-card">
      <div class="crud-header">
        <h1 class="crud-title">Formulario de Mesa</h1>
      </div>
  
      <form (ngSubmit)="guardar()" [formGroup]="formulario" autocomplete="off">
        <input id="id" name="id" type="hidden" value="-1">
  
        <div class="row">
          <div class="col-md-12 mb-3">
            <label for="codigoqr" class="form-label">Código QR</label>
            <input id="codigoqr" formControlName="codigoqr" type="text" class="form-control" placeholder="Ej: QR-MESA-01">
          </div>
  
          <div class="col-md-12 mb-3">
            <label for="estado" class="form-label">Estado</label>
            <select id="estado" formControlName="estado" class="form-select form-control" required>
              <option value="disponible">Disponible</option>
              <option value="ocupada">Ocupada</option>
              <option value="reservada">Reservada</option>
            </select>
          </div>
        </div>
  
        <div class="d-flex justify-content-end gap-2 mt-4">
          <button type="button" class="btn-crud-secondary" routerLink="/admin/gestionar-mesas">
            Volver
          </button>
          <button type="submit" class="btn-crud-primary">
            Guardar
          </button>
        </div>
      </form>
    </div>
  </div>
