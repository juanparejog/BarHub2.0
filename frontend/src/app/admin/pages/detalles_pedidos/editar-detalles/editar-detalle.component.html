<div class="crud-container">
  <div class="crud-form-card">
    <div class="crud-header">
      <h1 class="crud-title">Formulario de Detalle de Pedido</h1>
    </div>

    <form (ngSubmit)="guardar()" [formGroup]="formulario">
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Pedido</label>
          <select formControlName="id_pedido" class="form-select form-control">
            <option *ngFor="let pedido of pedidos" [ngValue]="pedido.id">
              Pedido #{{ pedido.id }} - {{ pedido.fecha }}
            </option>
          </select>
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">Producto</label>
          <select formControlName="id_producto" class="form-select form-control">
            <option *ngFor="let producto of productos" [ngValue]="producto.id">
              {{ producto.nombre }} (ID: {{ producto.id }})
            </option>
          </select>
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">Cantidad</label>
          <input type="number" min="1" formControlName="cantidad" class="form-control">
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">Precio Unitario (€)</label>
          <input type="number" min="0" step="0.01" formControlName="precio_unitario" class="form-control">
        </div>
      </div>

      <div class="d-flex justify-content-end gap-2 mt-4">
        <button type="button" class="btn-crud-secondary" routerLink="/admin/gestionar-detalles">
          Volver
        </button>
        <button type="submit" class="btn-crud-primary">
          Guardar
        </button>
      </div>
    </form>
  </div>
</div>
