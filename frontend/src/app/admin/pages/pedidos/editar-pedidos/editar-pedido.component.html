<div class="crud-container">
  <div class="crud-form-card">
    <div class="crud-header">
      <h1 class="crud-title">{{ editar ? 'Editar Pedido #' + formulario.get('id')?.value : 'Crear Nuevo Pedido' }}</h1>
    </div>

    <form (ngSubmit)="guardar()" [formGroup]="formulario">
      <div class="row">
        <!-- Usuario -->
        <div class="col-md-6 mb-3">
          <label class="form-label">Usuario</label>
          <select formControlName="id_user" class="form-select form-control">
            <option [ngValue]="null" disabled>Seleccione un usuario...</option>
            <option *ngFor="let user of users" [ngValue]="user.id">
              {{ user.nombre }} (ID: {{ user.id }})
            </option>
          </select>
        </div>

        <!-- Tipo de Pedido -->
        <div class="col-md-6 mb-3">
          <label class="form-label">Tipo de Pedido</label>
          <select formControlName="tipo_pedido" class="form-select form-control">
            <option value="recoger">Para Recoger</option>
            <option value="domicilio">A Domicilio</option>
            <option value="mesa">Mesa</option>
          </select>
        </div>

        <!-- Opción A: Mesa -->
        <div class="col-md-6 mb-3" *ngIf="formulario.get('tipo_pedido')?.value?.toLowerCase() === 'mesa'">
          <label class="form-label">Seleccionar Mesa</label>
          <select formControlName="id_mesa" class="form-select form-control">
            <option [ngValue]="null" disabled>Seleccione una mesa...</option>
            <option *ngFor="let mesa of mesas" [ngValue]="mesa.id">
              Mesa #{{ mesa.id }} - {{ mesa.codigoqr }}
            </option>
          </select>
        </div>

        <!-- Opción B: Domicilio -->
        <div class="col-md-6 mb-3" *ngIf="formulario.get('tipo_pedido')?.value?.toLowerCase() === 'domicilio'">
          <label class="form-label">Dirección de Entrega</label>
          <input type="text" formControlName="direccion_envio" class="form-control" placeholder="Calle, número, piso...">
        </div>

        <!-- Opción C: Recoger -->
        <div class="col-md-6 mb-3" *ngIf="formulario.get('tipo_pedido')?.value?.toLowerCase() === 'recoger'">
          <label class="form-label">Tienda / Local de Recogida</label>
          <input type="text" formControlName="direccion_tienda" class="form-control" placeholder="Nombre o dirección del local">
        </div>

        <!-- Estado -->
        <div class="col-md-6 mb-3">
          <label class="form-label">Estado</label>
          <select formControlName="estado" class="form-select form-control">
            <option value="pendiente">Pendiente</option>
            <option value="completado">Completado</option>
            <option value="cancelado">Cancelado</option>
          </select>
        </div>

        <!-- Fecha -->
        <div class="col-md-6 mb-3">
          <label class="form-label">Fecha</label>
          <input type="date" formControlName="fecha" class="form-control">
        </div>

        <!-- Total -->
        <div class="col-md-6 mb-3">
          <label class="form-label">Total (€)</label>
          <input type="number" step="0.01" formControlName="total" class="form-control" placeholder="0.00">
        </div>
      </div>

      <!-- Botones de Acción -->
      <div class="d-flex justify-content-end gap-2 mt-4">
        <button type="button" class="btn-crud-secondary" routerLink="/admin/gestionar-pedidos">
          Volver
        </button>
        <button type="submit" class="btn-crud-primary" [disabled]="formulario.invalid">
          {{ editar ? 'Actualizar' : 'Guardar' }}
        </button>
      </div>
    </form>
  </div>
</div>
