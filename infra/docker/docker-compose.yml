services:
  mysql:
    image: mariadb:13.0
    container_name: barhub-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Falta_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:?Falta_DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME:?Falta_DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Falta_DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      # Scripts de la primera arrancada: el usuario de la aplicacion queda obligado a usar TLS
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mariadb-admin ping -h 127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - barhub-net

  backend:
    build: ../../backend
    container_name: barhub-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mariadb://barhub-mysql:3306/${DB_DATABASE:?Falta_DB_DATABASE}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:?Falta_DB_USERNAME}
      - APP_CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:?Falta_DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET:?Falta_JWT_SECRET}
      # Verificacion en dos pasos: clave para cifrar los secretos TOTP (vacia: se deriva de JWT_SECRET)
      - APP_TOTP_CLAVE=${APP_TOTP_CLAVE:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - APP_UPLOAD_USUARIOS=/data/uploads/usuarios/
      - APP_UPLOAD_PRODUCTOS=/data/uploads/productos/
      - APP_SEED_DEMO=${APP_SEED_DEMO:-false}
      - APP_SEED_ADMIN_USERNAME=${APP_SEED_ADMIN_USERNAME:-admin}
      - APP_SEED_ADMIN_PASSWORD=${APP_SEED_ADMIN_PASSWORD:-}
      # Correo: por defecto Mailpit (local). En produccion, el SMTP real con MAIL_HOST, MAIL_PORT,
      # MAIL_USERNAME y MAIL_PASSWORD (y MAIL_STARTTLS=true)
      - SPRING_MAIL_HOST=${MAIL_HOST:-mailpit}
      - SPRING_MAIL_PORT=${MAIL_PORT:-1025}
      - SPRING_MAIL_USERNAME=${MAIL_USERNAME:-}
      - SPRING_MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=${MAIL_STARTTLS:-false}
      - APP_URL_PUBLICA=${SITE_ADDRESS:-http://localhost}
    volumes:
      - uploads_usuarios:/data/uploads/usuarios
      - uploads_productos:/data/uploads/productos
    networks:
      - barhub-net

  frontend:
    build: ../../frontend
    container_name: barhub-frontend
    restart: unless-stopped
    networks:
      - barhub-net

  caddy:
    image: caddy:2.11-alpine
    container_name: barhub-caddy
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:-http://localhost}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
      - uploads_usuarios:/srv/uploads/assets/images/usuarios:ro
      - uploads_productos:/srv/uploads/assets/images/productos:ro
    networks:
      - barhub-net

  duckdns:
    profiles: ["prod"]
    image: lscr.io/linuxserver/duckdns:8aabc87c-ls95
    container_name: barhub-duckdns
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      - SUBDOMAINS=${DUCKDNS_DOMAINS:-}
      - TOKEN=${DUCKDNS_TOKEN:-}
      - UPDATE_IP=ipv4
      - LOG_FILE=false
    volumes:
      - ../duckdns:/config
    networks:
      - barhub-net

  mailpit:
    # Solo para desarrollo y pruebas: captura todos los correos y no entrega ninguno.
    # Bandeja en http://localhost:8025 (solo desde el propio equipo)
    image: axllent/mailpit:v1.33.1
    container_name: barhub-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - barhub-net

  uptime-kuma:
    image: louislam/uptime-kuma:1.23.17
    container_name: barhub-uptime-kuma
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime_data:/app/data
    environment:
      - TZ=Europe/Madrid
    networks:
      - barhub-net

networks:
  barhub-net:
    driver: bridge

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
  caddy_logs:
  uptime_data:
  uploads_usuarios:
  uploads_productos:
