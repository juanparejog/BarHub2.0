services:
  mysql:
    image: mariadb:latest
    container_name: barhub-mysql
    restart: always
    network_mode: "host"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ../../backend
    container_name: barhub-backend
    restart: unless-stopped
    network_mode: "host"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://localhost:3306/${DB_DATABASE}?useSSL=false&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}

  frontend:
    build: ../../frontend
    container_name: barhub-frontend
    restart: unless-stopped
    network_mode: "host"

  caddy:
    image: caddy:2-alpine
    container_name: barhub-caddy
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: barhub-duckdns
    restart: unless-stopped
    network_mode: "host"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      - SUBDOMAINS=${DUCKDNS_DOMAINS}
      - TOKEN=${DUCKDNS_TOKEN}
      - UPDATE_IP=ipv4
      - LOG_FILE=false
    volumes:
      - ../duckdns:/config

  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: barhub-uptime-kuma
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - uptime_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=Europe/Madrid

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
  uptime_data: