services:
  mysql:
    image: mariadb:13.0
    container_name: barhub-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Falta_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:?Falta_DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME:?Falta_DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Falta_DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      # Scripts de la primera arrancada: el usuario de la aplicacion queda obligado a usar TLS
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mariadb-admin ping -h 127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - barhub-net

  backend:
    build: ../../backend
    container_name: barhub-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mariadb://barhub-mysql:3306/${DB_DATABASE:?Falta_DB_DATABASE}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:?Falta_DB_USERNAME}
      - APP_CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:?Falta_DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET:?Falta_JWT_SECRET}
      # Verificacion en dos pasos: clave para cifrar los secretos TOTP (vacia: se deriva de JWT_SECRET)
      - APP_TOTP_CLAVE=${APP_TOTP_CLAVE:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - APP_UPLOAD_USUARIOS=/data/uploads/usuarios/
      - APP_UPLOAD_PRODUCTOS=/data/uploads/productos/
      - APP_SEED_DEMO=${APP_SEED_DEMO:-false}
      - APP_SEED_ADMIN_USERNAME=${APP_SEED_ADMIN_USERNAME:-admin}
      - APP_SEED_ADMIN_PASSWORD=${APP_SEED_ADMIN_PASSWORD:-}
      # Correo: por defecto Mailpit (local). En produccion, el SMTP real con MAIL_HOST, MAIL_PORT,
      # MAIL_USERNAME y MAIL_PASSWORD (y MAIL_STARTTLS=true)
      - SPRING_MAIL_HOST=${MAIL_HOST:-mailpit}
      - SPRING_MAIL_PORT=${MAIL_PORT:-1025}
      - SPRING_MAIL_USERNAME=${MAIL_USERNAME:-}
      - SPRING_MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=${MAIL_STARTTLS:-false}
      - APP_URL_PUBLICA=${SITE_ADDRESS:-http://localhost}
      # Ademas de la consola, el log va en JSON a un fichero que lee el SOC (perfil "soc").
      # Spring Boot lo rota a los 10 MB y guarda 7 dias
      - LOGGING_FILE_NAME=/var/log/barhub/backend.log
      - LOGGING_STRUCTURED_FORMAT_FILE=logstash
    volumes:
      - uploads_usuarios:/data/uploads/usuarios
      - uploads_productos:/data/uploads/productos
      - backend_logs:/var/log/barhub
    networks:
      - barhub-net

  frontend:
    build: ../../frontend
    container_name: barhub-frontend
    restart: unless-stopped
    networks:
      - barhub-net

  caddy:
    image: caddy:2.11-alpine
    container_name: barhub-caddy
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:-http://localhost}
      - CSP_CABECERA=${CSP_CABECERA:-Content-Security-Policy}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
      - uploads_usuarios:/srv/uploads/assets/images/usuarios:ro
      - uploads_productos:/srv/uploads/assets/images/productos:ro
    networks:
      - barhub-net

  duckdns:
    profiles: ["prod"]
    image: lscr.io/linuxserver/duckdns:8aabc87c-ls95
    container_name: barhub-duckdns
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      - SUBDOMAINS=${DUCKDNS_DOMAINS:-}
      - TOKEN=${DUCKDNS_TOKEN:-}
      - UPDATE_IP=ipv4
      - LOG_FILE=false
    volumes:
      - ../duckdns:/config
    networks:
      - barhub-net

  mailpit:
    # Solo para desarrollo y pruebas: captura todos los correos y no entrega ninguno.
    # Bandeja en http://localhost:8025 (solo desde el propio equipo)
    image: axllent/mailpit:v1.33.1
    container_name: barhub-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - barhub-net

  uptime-kuma:
    image: louislam/uptime-kuma:1.23.17
    container_name: barhub-uptime-kuma
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime_data:/app/data
    environment:
      - TZ=Europe/Madrid
    networks:
      - barhub-net

  # --- SOC (perfil "soc"): se despliega y se prueba con seguridad/soc/soc.py ---
  # Alloy lee los logs de Caddy y del backend, Loki los guarda 30 dias y evalua las reglas de
  # alerta, Alertmanager avisa (correo, y Telegram si se configura) y Grafana los muestra.
  # Ningun puerto sale del propio equipo: en produccion se entra por un tunel SSH.
  loki:
    profiles: ["soc"]
    image: grafana/loki:3.7.7
    container_name: barhub-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/barhub/loki.yml"]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ../../seguridad/soc/loki/loki.yml:/etc/loki/barhub/loki.yml:ro
      # Reglas de alerta. Sin multiusuario, Loki las busca en la carpeta del usuario "fake"
      - ../../seguridad/soc/loki/reglas:/etc/loki/reglas/fake:ro
      - loki_data:/loki
    networks:
      - barhub-net

  alloy:
    profiles: ["soc"]
    image: grafana/alloy:v1.21.0
    container_name: barhub-alloy
    restart: unless-stopped
    # Como root para leer el log de Caddy (0600, de root), pero sin ninguna capacidad: solo lee
    # los dos volumenes de logs, en modo lectura, y no tiene acceso a Docker
    user: "0:0"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy-barhub", "/etc/alloy/barhub/config.alloy"]
    depends_on:
      - loki
    volumes:
      - ../../seguridad/soc/alloy/config.alloy:/etc/alloy/barhub/config.alloy:ro
      - caddy_logs:/var/log/caddy:ro
      - backend_logs:/var/log/barhub:ro
      - alloy_data:/var/lib/alloy-barhub
    networks:
      - barhub-net

  alertmanager:
    profiles: ["soc"]
    image: prom/alertmanager:v0.34.1
    container_name: barhub-alertmanager
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    # alertmanager.yml lo genera soc.py a partir del .env (no se sube al repositorio)
    command: ["--config.file=/etc/alertmanager/barhub/alertmanager.yml", "--storage.path=/alertmanager", "--web.external-url=http://127.0.0.1:9093"]
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ../../seguridad/soc/alertmanager:/etc/alertmanager/barhub:ro
      - alertmanager_data:/alertmanager
    networks:
      - barhub-net

  grafana:
    profiles: ["soc"]
    image: grafana/grafana:13.2.0
    container_name: barhub-grafana
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    depends_on:
      - loki
      - alertmanager
    environment:
      - GF_SECURITY_ADMIN_USER=${SOC_GRAFANA_USUARIO:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${SOC_GRAFANA_CLAVE:-}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_NEWS_NEWS_FEED_ENABLED=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/paneles-barhub/soc.json
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ../../seguridad/soc/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../seguridad/soc/grafana/paneles:/etc/grafana/paneles-barhub:ro
      - grafana_data:/var/lib/grafana
    networks:
      - barhub-net

networks:
  barhub-net:
    driver: bridge

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
  caddy_logs:
  uptime_data:
  backend_logs:
  loki_data:
  alloy_data:
  alertmanager_data:
  grafana_data:
  uploads_usuarios:
  uploads_productos:
