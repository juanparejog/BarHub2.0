plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.2.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

// Spring Boot 4 ya trae versiones corregidas de Tomcat (11), Jackson (3), Logback e Hibernate Validator (9):
// se quitan los ext[...] que forzaban versiones por encima del BOM de la 3.5 (ver docs/auditorias.md).

dependencyLocking {
    lockAllConfigurations()
}

group = 'com.daw2.barhub'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // Correos de confirmacion de cuenta y de recuperacion de contrasena
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    implementation 'io.jsonwebtoken:jjwt-impl:0.13.0'
    // Gson en lugar de Jackson: jjwt-jackson usa Jackson 2, y Spring Boot 4 trae Jackson 3
    implementation 'io.jsonwebtoken:jjwt-gson:0.13.0'

    implementation 'com.stripe:stripe-java:34.2.0'

    // Connector/J 4: TLS por defecto con verificacion completa (sslMode=verify-full). Con MariaDB 11.4 o
    // superior el certificado autogenerado del servidor se valida durante el login, sin configurar nada.
    implementation 'org.mariadb.jdbc:mariadb-java-client:4.0.0'

    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    // En Spring Boot 4 el soporte de @WithMockUser con MockMvc va en su propio starter
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'

    constraints {
        // Mockito trae objenesis 3.3, con un aviso de Snyk corregido en la 3.6 (solo en los tests)
        testRuntimeOnly('org.objenesis:objenesis:3.6') {
            because 'SNYK-JAVA-ORGOBJENESIS-21755439'
        }
    }
}

// JaCoCo (solo genera el informe de cobertura, no va en la aplicacion) trae ASM 9.8, con cinco avisos
// de Snyk corregidos en la 9.11. Se alinea con la 9.11.1 que ya usan los tests.
configurations.matching { it.name == 'jacocoAnt' }.configureEach {
    resolutionStrategy.eachDependency { detalle ->
        if (detalle.requested.group == 'org.ow2.asm') {
            detalle.useVersion '9.11.1'
            detalle.because 'Avisos de Snyk en ASM 9.8 (SNYK-JAVA-ORGOW2ASM-21715439 y siguientes)'
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

jacoco {
    // Fija la version que impone la gestion de dependencias de Spring Boot;
    // sin esto, Gradle 8.14 pide otra distinta y el agente no se resuelve.
    toolVersion = '0.8.13'
}

jacocoTestReport {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}