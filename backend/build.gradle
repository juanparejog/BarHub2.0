plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.2.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

// Spring Boot 4 ya trae versiones corregidas de Tomcat (11), Jackson (3), Logback e Hibernate Validator (9):
// se quitan los ext[...] que forzaban versiones por encima del BOM de la 3.5 (ver docs/auditorias.md).

dependencyLocking {
    lockAllConfigurations()
}

group = 'com.daw2.barhub'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    implementation 'io.jsonwebtoken:jjwt-impl:0.12.5'
    // Gson en lugar de Jackson: jjwt-jackson usa Jackson 2, y Spring Boot 4 trae Jackson 3
    implementation 'io.jsonwebtoken:jjwt-gson:0.12.5'

    implementation 'com.stripe:stripe-java:24.7.0'

    implementation 'org.mariadb.jdbc:mariadb-java-client:3.5.11'

    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    // En Spring Boot 4 el soporte de @WithMockUser con MockMvc va en su propio starter
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

jacoco {
    // Fija la version que impone la gestion de dependencias de Spring Boot;
    // sin esto, Gradle 8.14 pide otra distinta y el agente no se resuelve.
    toolVersion = '0.8.13'
}

jacocoTestReport {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}