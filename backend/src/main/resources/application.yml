server:
  port: 8080

stripe:
  secret-key: ${STRIPE_SECRET_KEY}

spring:
  config:
    import: optional:env.properties
  sql:
    init:
      mode: always
  application:
    name: BarHub
  datasource:
    url: jdbc:mariadb://127.0.0.1:3306/barhub2_0
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driverClassName: org.mariadb.jdbc.Driver
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        show_sql: false
        jdbc:
          time_zone: UTC
  main:
    allow-bean-definition-overriding: false
  jackson:
    # Spring Boot 4 usa Jackson 3; se mantienen los valores por defecto de Jackson 2 para
    # que la API responda y acepte exactamente el mismo JSON que con Spring Boot 3.5
    use-jackson2-defaults: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB     

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

file:
  name: logs/app.log

jwt:
  jwtSecret: ${JWT_SECRET}
  jwtExpirationMs: 14400000