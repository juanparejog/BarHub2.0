server:
  port: 8080
  # Detras de Caddy: la IP del cliente sale de X-Forwarded-For, que Tomcat solo acepta de proxies
  # de la red interna (Docker). La usan el bloqueo de login por IP y el registro de sesiones
  forward-headers-strategy: native

spring:
  config:
    import: optional:env.properties
  sql:
    init:
      mode: always
  application:
    name: BarHub
  datasource:
    url: jdbc:mariadb://127.0.0.1:3306/barhub2_0
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driverClassName: org.mariadb.jdbc.Driver
  jpa:
    # Sin sesion de Hibernate abierta durante toda la peticion: las relaciones perezosas se cargan
    # en el repositorio o en el servicio (con @EntityGraph o @Transactional), no al serializar.
    open-in-view: false
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        show_sql: false
        jdbc:
          time_zone: UTC
  main:
    allow-bean-definition-overriding: false
  jackson:
    # Spring Boot 4 usa Jackson 3; se mantienen los valores por defecto de Jackson 2 para
    # que la API responda y acepte exactamente el mismo JSON que con Spring Boot 3.5
    use-jackson2-defaults: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB     

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

file:
  name: logs/app.log

jwt:
  jwtSecret: ${JWT_SECRET}
  # Token de acceso: 15 minutos. La sesion continua con el token de renovacion (app.sesion)
  jwtExpirationMs: 900000

app:
  # URL con la que el usuario abre la web: la usan los enlaces de los correos
  url-publica: ${APP_URL_PUBLICA:http://localhost}
  # Pago con tarjeta con Stripe. Sin las dos claves, solo se puede pagar en efectivo.
  # solo-pruebas: con claves reales (sk_live_), la tarjeta queda desactivada hasta ponerlo a false
  pagos:
    solo-pruebas: ${APP_PAGOS_SOLO_PRUEBAS:true}
    stripe:
      clave-secreta: ${STRIPE_SECRET_KEY:}
      clave-publica: ${STRIPE_PUBLISHABLE_KEY:}
  correo:
    remitente: ${APP_CORREO_REMITENTE:BarHub <no-responder@barhub.local>}
  # Avisos en tiempo real (Server-Sent Events): cada conexion dura como mucho esto y luego el
  # navegador se vuelve a conectar con su token del momento
  tiempo-real:
    duracion: 5m
    maximo-conexiones: 500
  # Registro de auditoria (Admin > Auditoria): las entradas se borran pasado este tiempo
  auditoria:
    dias: ${APP_AUDITORIA_DIAS:365}
  # Verificacion en dos pasos con una app de autenticacion (TOTP)
  dos-factores:
    # Roles que no pueden entrar sin ella; para el resto es opcional
    obligatorio: admin,empleado
    # Nombre con el que aparece la cuenta en la app
    emisor: BarHub
    # Clave para cifrar los secretos TOTP y firmar los codigos de recuperacion. Si se deja vacia se
    # deriva de JWT_SECRET; si cambia, quien tenga el 2FA activado tendra que configurarlo otra vez
    clave: ${APP_TOTP_CLAVE:}
  sesion:
    # Cookie HttpOnly con el token de renovacion. La ruta es la que ve el navegador: con Caddy, /api/auth;
    # con ng serve contra el backend directo (http://localhost:8080) hay que usar /auth
    cookie:
      nombre: barhub_refresh
      ruta: ${APP_SESION_COOKIE_RUTA:/api/auth}
      segura: ${APP_SESION_COOKIE_SEGURA:true}
    # Margen para que dos pestanas renueven a la vez con el mismo token sin que cuente como robo
    gracia-rotacion: 30s
    # Tras iniciar sesion o confirmar el codigo de nuevo, el administrador puede hacer acciones
    # criticas (alta, edicion y borrado de usuarios, restablecer su 2FA) durante este tiempo
    reautenticacion: 5m
    # Limites por rol: inactividad maxima y duracion maxima de la sesion aunque haya actividad.
    # Con varios roles se aplica el mas estricto
    roles:
      admin:
        inactividad: 15m
        maximo: 8h
      empleado:
        inactividad: 30m
        maximo: 10h
      cliente:
        inactividad: 1h
        maximo: 12h